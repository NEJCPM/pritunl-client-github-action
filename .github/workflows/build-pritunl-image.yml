name: Build Pritunl Client Image

on:
  workflow_dispatch:
    inputs:
      pritunl-version:
        description: Pritunl Client version tag (e.g. 1.3.4696.56)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      image_tag_amd64: ghcr.io/nejcpm/pritunl-client:${{ inputs.pritunl-version }}-amd64
      image_tag_arm64: ghcr.io/nejcpm/pritunl-client:${{ inputs.pritunl-version }}-arm64
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Clone Pritunl repository
        run: |
          git clone --branch "${{ inputs.pritunl-version }}" --depth 1 \
            https://github.com/pritunl/pritunl-client-electron.git /tmp/pritunl-src

      - name: Build Pritunl CLI
        run: |
          (cd /tmp/pritunl-src/cli && \
            CGO_ENABLED=0 go build -o "${GITHUB_WORKSPACE}/pritunl-client" .)
          chmod +x pritunl-client
          file pritunl-client

      - name: Build Pritunl Service
        run: |
          (cd /tmp/pritunl-src/service && \
            CGO_ENABLED=0 go build -o "${GITHUB_WORKSPACE}/pritunl-client-service" .)
          chmod +x pritunl-client-service
          file pritunl-client-service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.pritunl
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/nejcpm/pritunl-client:${{ inputs.pritunl-version }}-${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/nejcpm/pritunl-client:${{ inputs.pritunl-version }} \
            -t ghcr.io/nejcpm/pritunl-client:latest \
            ghcr.io/nejcpm/pritunl-client:${{ inputs.pritunl-version }}-amd64 \
            ghcr.io/nejcpm/pritunl-client:${{ inputs.pritunl-version }}-arm64
