version: '3.8'

services:
  mongo:
    image: mongo:7.0.15
    container_name: pritunl-mongo-test
    restart: always
    environment:
      MONGO_INITDB_DATABASE: pritunl
    volumes:
      - mongo-data:/data/db

  pritunl:
    image: pritunl/pritunl:1.30.3381.85
    container_name: pritunl-server-test
    restart: always
    privileged: true
    capabilities:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      MONGODB_URI: mongodb://mongo:27017/pritunl
    ports:
      - "443:443/tcp"
      - "1194:1194/udp"
    depends_on:
      - mongo

volumes:
  mongo-data:
