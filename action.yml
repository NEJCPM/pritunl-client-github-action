# Define the GitHub Action
name: Pritunl Client GitHub Action
description: Establish automated secure Pritunl VPN connections with Pritunl Client in GitHub Actions, supporting OpenVPN and WireGuard.

# Define branding for the GitHub Marketplace
branding:
  icon: server
  color: gray-dark

# Define inputs for the Action
inputs:
  profile-file:
    description: Pritunl Profile Key file
    required: true
    default: ''

  profile-pin:
    description: Pritunl Profile PIN/Password
    required: false
    default: ''

  profile-server:
    description: Pritunl Profile Server (for specifying a particular server or multiple servers within a profile)
    required: false
    default: ''

  vpn-mode:
    description: VPN mode (ovpn for OpenVPN or wg for WireGuard)
    required: false
    default: 'ovpn'

  client-version:
    description: Pritunl Client version (defaults to package manager version)
    required: false
    default: 'from-package-manager'

  client-sha256:
    description: Expected SHA-256 of the versioned client artifact (required for versions not pinned in the checksum manifest)
    required: false
    default: ''

  start-connection:
    description: Start VPN connection automatically (true/false)
    required: false
    default: 'true'

  ready-profile-timeout:
    description: Wait for Ready Profile timeout (seconds)
    required: false
    default: '3'

  established-connection-timeout:
    description: Wait for Established Connection timeout (seconds)
    required: false
    default: '30'

  concealed-outputs:
    description: Concealed Outputs (true/false)
    required: false
    default: 'true'

# Define outputs for the Action
outputs:
  client-id:
    description: Primary Client ID (string, bash variable)
    value: ${{ steps.pritunl-client.outputs.client-id }}

  client-ids:
    description: All Client IDs and Names (JSON array)
    value: ${{ steps.pritunl-client.outputs.client-ids }}

# Define the Action's workflow
runs:
  using: "composite"
  steps:
    - name: Setup Pritunl Client
      id: pritunl-client
      env:
        # Set environment variables for input values
        PRITUNL_PROFILE_FILE: ${{ inputs.profile-file }}
        PRITUNL_PROFILE_PIN: ${{ inputs.profile-pin }}
        PRITUNL_PROFILE_SERVER: ${{ inputs.profile-server }}
        PRITUNL_VPN_MODE: ${{ inputs.vpn-mode }}
        PRITUNL_CLIENT_VERSION: ${{ inputs.client-version }}
        PRITUNL_CLIENT_SHA256: ${{ inputs.client-sha256 }}
        PRITUNL_START_CONNECTION: ${{ inputs.start-connection }}
        PRITUNL_READY_PROFILE_TIMEOUT: ${{ inputs.ready-profile-timeout }}
        PRITUNL_ESTABLISHED_CONNECTION_TIMEOUT: ${{ inputs.established-connection-timeout }}
        PRITUNL_CONCEALED_OUTPUTS: ${{ inputs.concealed-outputs }}
        PRITUNL_ACTION_REF: ${{ github.action_ref }}
      shell: bash
      run: |
        set -euo pipefail
        os="$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
        # dist binary names use the Go toolchain OS name for macOS
        if [ "$os" = "macos" ]; then os="darwin"; fi
        case "$RUNNER_ARCH" in
          X64) arch="amd64" ;;
          ARM64) arch="arm64" ;;
          *) echo "::error::Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        suffix=""
        if [ "$os" = "windows" ]; then suffix=".exe"; fi
        name="pritunl-action-${os}-${arch}${suffix}"

        # Prefer a locally built dist/ (development and package tests);
        # otherwise download the binary from the release of the ref in use.
        binary="${GITHUB_ACTION_PATH}/dist/${name}"
        if [ ! -x "$binary" ]; then
          ref="${PRITUNL_ACTION_REF:-}"
          if [[ ! "$ref" =~ ^v[0-9]+(\.[0-9]+\.[0-9]+)?$ ]]; then
            echo "::error::No release assets for action ref '${ref:-unknown}'. Use a published major or SemVer tag (for example, @v1 or @v1.2.3)." >&2
            exit 1
          fi
          base="https://github.com/NEJCPM/pritunl-client-github-action/releases/download/${ref}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl -fsSL "$base/SHA256SUMS" -o "$workdir/SHA256SUMS"
          curl -fsSL "$base/$name" -o "$workdir/$name"
          if ! awk -v name="$name" '$2 == name { print; count++ } END { exit count != 1 }' \
            "$workdir/SHA256SUMS" > "$workdir/checksum"; then
            echo "::error::Missing or duplicate checksum entry for $name in release $ref" >&2
            exit 1
          fi
          if ! (cd "$workdir" && \
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum --check checksum >/dev/null
            else
              shasum -a 256 --check checksum >/dev/null
            fi); then
            echo "::error::Checksum verification failed for $name from release $ref" >&2
            exit 1
          fi
          chmod +x "$workdir/$name"
          binary="$workdir/$name"
        fi
        echo "Using action binary: $binary"
        "$binary"
