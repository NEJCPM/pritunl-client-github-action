name: Release Action Binaries

on:
  workflow_dispatch:
    inputs:
      create_tag:
        description: 'Create/publish tag vMAJOR.MINOR.PATCH (e.g. v1.1.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'

      - name: Run Unit Tests
        run: go test ./pkg/...

      - name: Vet
        run: go vet ./...

      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/pritunl-action-* dist/SHA256SUMS
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64.exe; do
            os="${target%%-*}"
            arch="${target#*-}"; arch="${arch%.exe}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/pritunl-action-$target" ./cmd/pritunl-action
          done
          (cd dist && shasum -a 256 pritunl-action-* > SHA256SUMS)

      - name: Verify binaries
        run: |
          set -euo pipefail
          for f in dist/pritunl-action-*; do
            test -s "$f" || { echo "::error::Empty binary: $f"; exit 1; }
            chmod +x "$f"
          done
          (cd dist && shasum -a 256 --check SHA256SUMS)
          file dist/pritunl-action-*

      - name: Commit dist to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dist/
          if git diff --cached --quiet; then
            echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "dist/ unchanged"
          else
            git commit -m "release: rebuild precompiled action binaries [skip ci]"
            git push origin main
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: build
    if: inputs.create_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dist commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}

      - name: Validate SemVer tag format
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.create_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::create_tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Create and push tag
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "${{ inputs.create_tag }}"
          git push origin "${{ inputs.create_tag }}"
          # Move the rolling alias if it matches the same major
          if [[ "${{ inputs.create_tag }}" =~ ^v([0-9]+)\. ]]; then
            alias="v${BASH_REMATCH[1]}"
            git tag -f "$alias" "${{ inputs.create_tag }}"
            git push origin "$alias" --force
          fi