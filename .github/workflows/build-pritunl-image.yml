name: Build Pritunl Client Image

on:
  workflow_dispatch:
    inputs:
      pritunl-version:
        description: Pritunl Client version tag (e.g. 1.3.4696.56)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      image_tag_amd64: ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client:${{ inputs.pritunl-version }}-amd64
      image_tag_arm64: ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client:${{ inputs.pritunl-version }}-arm64
      pritunl_commit: ${{ steps.resolve_commit.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Clone Pritunl repository
        run: |
          git clone --branch "${{ inputs.pritunl-version }}" --depth 1 \
            https://github.com/pritunl/pritunl-client-electron.git /tmp/pritunl-src

      - name: Resolve Pritunl commit SHA
        id: resolve_commit
        run: |
          commit="$(git -C /tmp/pritunl-src rev-parse HEAD)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "Building Pritunl ${{ inputs.pritunl-version }} at commit ${commit}"

      - name: Build Pritunl CLI
        run: |
          (cd /tmp/pritunl-src/cli && \
            CGO_ENABLED=0 go build -o "${GITHUB_WORKSPACE}/pritunl-client" .)
          chmod +x pritunl-client
          file pritunl-client

      - name: Build Pritunl Service
        run: |
          (cd /tmp/pritunl-src/service && \
            CGO_ENABLED=0 go build -o "${GITHUB_WORKSPACE}/pritunl-client-service" .)
          chmod +x pritunl-client-service
          file pritunl-client-service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile.pritunl
          platforms: linux/${{ matrix.arch }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/pritunl/pritunl-client-electron
            org.opencontainers.image.revision=${{ steps.resolve_commit.outputs.commit }}
            org.opencontainers.image.version=${{ inputs.pritunl-version }}
          tags: ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client:${{ inputs.pritunl-version }}-${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.digest.outputs.digest }}
      pritunl_commit: ${{ needs.build.outputs.pritunl_commit }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client:${{ inputs.pritunl-version }} \
            -t ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client:latest \
            ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client:${{ inputs.pritunl-version }}-amd64 \
            ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client:${{ inputs.pritunl-version }}-arm64

      - name: Resolve multi-arch digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect \
            ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client:${{ inputs.pritunl-version }} \
            --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Multi-arch digest: ${digest}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign multi-arch image digest (keyless)
        env:
          DIGEST: ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${DIGEST}"
          echo "Image signed: ${DIGEST}"

      - name: Verify signature with the release policy
        env:
          DIGEST: ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/NEJCPM/pritunl-client-github-action/\.github/workflows/build-pritunl-image\.yml@refs/(heads/main|tags/.+)$' \
            "${DIGEST}"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2

      - name: Generate SBOM for the multi-arch image
        env:
          IMAGE_REF: ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          syft "${IMAGE_REF}" -o spdx-json=sbom-${{ inputs.pritunl-version }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ inputs.pritunl-version }}
          path: sbom-${{ inputs.pritunl-version }}.spdx.json

      - name: Attest SBOM to the registry
        env:
          SBOM_FILE: sbom-${{ inputs.pritunl-version }}.spdx.json
          DIGEST: ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --predicate "${SBOM_FILE}" --type spdxjson "${DIGEST}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Verify attestations with the release policy
        env:
          DIGEST: ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/NEJCPM/pritunl-client-github-action/\.github/workflows/build-pritunl-image\.yml@refs/(heads/main|tags/.+)$' \
            "${DIGEST}"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/NEJCPM/pritunl-client-github-action/\.github/workflows/build-pritunl-image\.yml@refs/(heads/main|tags/.+)$' \
            "${DIGEST}"

      - name: Publish image provenance
        env:
          PRITUNL_COMMIT: ${{ needs.build.outputs.pritunl_commit }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          cat <<EOF
          ## Pritunl Client Image provenance (${{ inputs.pritunl-version }})
          - image: ghcr.io/nejcpm/pritunl-client-github-action/pritunl-client:${{ inputs.pritunl-version }}
          - digest: ${DIGEST}
          - pritunl commit: ${PRITUNL_COMMIT}
          - signature: cosign keyless (GitHub OIDC), policy =
            issuer=https://token.actions.githubusercontent.com
            repo=NEJCPM/pritunl-client-github-action
            workflow=build-pritunl-image.yml
          - attestations: spdxjson SBOM + slsaprovenance (cosign keyless)
          EOF