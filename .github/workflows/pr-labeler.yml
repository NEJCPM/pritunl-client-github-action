name: Pull Request Labeler

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-labeler:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Label Pull Request
        uses: actions/labeler@v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
