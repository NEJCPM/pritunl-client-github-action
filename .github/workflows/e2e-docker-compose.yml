name: Integration & E2E Tests (Docker Compose)

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true

      - name: Run Unit Tests
        run: go test ./pkg/...

      # The e2e suite starts the Pritunl/Mongo stack itself, provisions the
      # client through the real production path (apt + GPG keyring), imports
      # a dynamically generated profile and validates the tunnel.
      - name: Run E2E Integration Tests
        working-directory: test/e2e
        run: |
          go test -v -tags=e2e -timeout 25m \
            -run 'TestE2E_PritunlServerAuth|TestE2E_ProfileFixture|TestE2E_FullActionFlowLinux' .

      - name: Teardown Docker Compose
        if: always()
        working-directory: test/e2e
        run: |
          docker compose -f docker-compose.test.yml down -v
