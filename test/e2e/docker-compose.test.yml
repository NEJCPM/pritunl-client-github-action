services:
  mongo:
    image: mongo@sha256:8958f43a940142d2a4572bb4d4f147ab26994a3da1cead6d39876b96451a4f1a # mongo:7.0.15
    container_name: pritunl-mongo-test
    restart: always
    environment:
      MONGO_INITDB_DATABASE: pritunl
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  pritunl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pritunl-server-test
    restart: always
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      MONGODB_URI: mongodb://mongo:27017/pritunl
    ports:
      - "443:443/tcp"
      - "1194:1194/udp"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://localhost:443/" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30

volumes:
  mongo-data:
